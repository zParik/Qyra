[package]
name = "qyra"
version = "0.1.0"
description = "The free, offline, open-source PDF Swiss Army Knife"
authors = ["you"]
edition = "2021"

[lib]
name = "qyra_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Integration tests (src-tauri/tests/) are a separate crate, so they need their
# own copies of anything they touch. Versions MUST match the [dependencies]
# entries so types shared across the boundary (e.g. lopdf::Document) line up.
[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
lopdf = "0.40"
mupdf = { version = "0.6", default-features = false, features = ["system-fonts", "tesseract"] }
serde_json = "1"
image = { version = "0.25", features = ["png", "jpeg", "webp"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.40"
rand = "0.10"
# zlib-rs backend: a pure-Rust deflate implementation that is markedly faster
# than the default miniz_oxide, with no C/cmake build dependency (keeps the
# Windows build simple). The native compressor recompresses every
# Flate stream, so this speeds the hot path 2-3x. Output stays standard zlib.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
# Signature images arrive from the webview as data URLs.
base64 = "0.22"
# Memory-map PDF inputs so huge files are not read into the heap (no OOM at read).
memmap2 = "0.9"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
rayon = "1"
tempfile = "3"
thiserror = "1"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# Only PDFs are opened, so MuPDF's other document handlers (XPS, SVG, CBZ,
# HTML, EPUB, image files) and its JavaScript engine are left out.
# tesseract stays for OCR.
mupdf = { version = "0.6", default-features = false, features = ["system-fonts", "tesseract"] }
tauri-plugin-updater = "2"

# libc on unix for setpriority() in the worker thread scheduling.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ── Build profiles ────────────────────────────────────────────────────────────
# Release: maximize runtime speed of the Rust+C hot paths — MuPDF render, image
# JPEG encode, the pdf parser/rewriter, lopdf split/merge. thin-LTO + a single
# codegen unit trade compile time for ~10-25% faster binaries; strip shrinks it.
# NOTE: panic = "abort" is deliberately NOT set — command handlers rely on
# spawn_blocking catching task panics and returning them as AppError (JoinError).
# panic=abort would turn a caught render panic into a whole-app crash.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dev: keep OUR crate fast to compile and fully debuggable (opt-level 1 retains
# line info), but compile every DEPENDENCY at opt-level 3 so the heavy stack
# (MuPDF C via cc, image, flate2, lopdf, mupdf) runs release-grade under
# `cargo tauri dev`. This is the single biggest fix for "everything is sluggish
# in dev" — debug-mode MuPDF/image is 10-50x slower than optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

